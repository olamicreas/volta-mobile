<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        body { width: 320px; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 15px; margin: 0; background: #f9fafb; color: #111827; }
        h3 { margin-top: 0; font-size: 16px; border-bottom: 1px solid #e5e7eb; padding-bottom: 8px; }
        .draft-item { background: white; border: 1px solid #e5e7eb; padding: 10px; margin-bottom: 10px; border-radius: 6px; }
        .field-name { font-weight: bold; font-size: 12px; color: #4b5563; margin-bottom: 4px; }
        .field-value { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
        button { width: 100%; padding: 8px; background: #ef4444; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background: #dc2626; }
        #empty-state { font-size: 14px; color: #6b7280; text-align: center; margin: 20px 0; }
    </style>
</head>
<body>
    <h3>Current Site Drafts</h3>
    <div id="drafts-container"></div>
    <button id="clear-btn">Clear Local Drafts</button>
    <script src="popup.js"></script>
</body>
</html>
