<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Bank</title>
    <style>
        /* Basic styling for the modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgb(0,0,0);
            background-color: rgba(0,0,0,0.4);
        }
        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
        }
        .close {
            color: #aaa;
            float: right;
            font-size: 28px;
            font-weight: bold;
        }
        .close:hover,
        .close:focus {
            color: black;
            text-decoration: none;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <!-- Login Page -->
    <div id="loginPage" style="display: block;">
        <h2>Login</h2>
        <form id="loginForm">
            <label for="username">Username:</label>
            <input type="text" id="username" name="username" required><br><br>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" required><br><br>
            <button type="submit">Login</button>
        </form>
    </div>

    <!-- Home Page -->
    <div id="homePage" style="display: none;">
        <h2>Welcome to Web Bank</h2>
        <p>Your Balance: $6050</p>
        <button id="withdrawBtn">Withdraw</button>
    </div>

    <!-- Modal for Withdrawal -->
    <div id="withdrawModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Withdraw Funds</h2>
            <form id="withdrawForm">
                <label for="recipientBank">Recipient Bank Name:</label>
                <input type="text" id="recipientBank" name="recipientBank" required><br><br>
                <label for="recipientUsername">Recipient Username:</label>
                <input type="text" id="recipientUsername" name="recipientUsername" required><br><br>
                <label for="recipientPassword">Recipient Password:</label>
                <input type="password" id="recipientPassword" name="recipientPassword" required><br><br>
                <label for="amount">Amount to Send:</label>
                <input type="number" id="amount" name="amount" required><br><br>
                <button type="submit">Send</button>
            </form>
        </div>
    </div>

    <script>
        // Function to handle login
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault();
            document.getElementById('loginPage').style.display = 'none';
            document.getElementById('homePage').style.display = 'block';
        });

        // Function to handle withdrawal
        document.getElementById('withdrawBtn').addEventListener('click', function() {
            document.getElementById('withdrawModal').style.display = 'block';
        });

        // Function to close the modal
        document.querySelector('.close').addEventListener('click', function() {
            document.getElementById('withdrawModal').style.display = 'none';
        });

        // Function to handle form submission in the modal
        document.getElementById('withdrawForm').addEventListener('submit', function(event) {
            event.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            const currentBalance = 6050;
            if (amount > 0 && amount <= currentBalance) {
                const newBalance = currentBalance - amount;
                document.querySelector('#homePage p').textContent = `Your Balance: $${newBalance}`;
                document.getElementById('withdrawModal').style.display = 'none';
                alert(`$${amount} has been sent successfully.`);
            } else {
                alert('Invalid amount. Please enter a valid amount.');
            }
        });
    </script>
</body>
</html>
