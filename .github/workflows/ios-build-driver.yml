name: Build iOS Driver App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: Vn6hHQ1cb4AF0iNdANOmlb5oGSMZ7zFYFy4jdaKy

      - name: Setup Xcode 16.1
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.1'

      - name: Download iOS Platform
        run: xcodebuild -downloadPlatform iOS

      - name: Force HTTPS for SPM
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        working-directory: volta-driver
        run: npm install

      - name: Build iOS App locally on macOS Runner
        working-directory: volta-driver
        run: |
          set -o pipefail
          EAS_LOCAL_BUILD_SKIP_CLEANUP=1 EAS_BUILD_DISABLE_DOCTOR=1 eas build --platform ios --profile production --local --non-interactive --verbose-logs --output Driver-iOS.ipa 2>&1 | tee eas_build_output.log

      - name: Dump xcodebuild logs on failure
        if: failure()
        run: |
          find /var/folders -name "*.log" -exec cat {} + > xcodelog.txt || true
          curl -T xcodelog.txt https://transfer.sh/driver-xcodelog.txt > url.txt || true
          cat url.txt || true
          cat xcodelog.txt | tail -n 1000 || true

      - name: Submit iOS App to TestFlight
        working-directory: volta-driver
        run: eas submit --platform ios --profile production --path Driver-iOS.ipa --non-interactive
