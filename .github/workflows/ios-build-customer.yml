name: Build iOS Customer App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: Vn6hHQ1cb4AF0iNdANOmlb5oGSMZ7zFYFy4jdaKy

      - name: Setup Xcode 16.4
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Download iOS Platform
        run: |
          for i in 1 2 3; do
            xcodebuild -downloadPlatform iOS && break || sleep 15;
          done

      - name: Force HTTPS for SPM
        run: git config --global url."https://github.com/".insteadOf "git@github.com:"

      - name: Install dependencies
        working-directory: volta-customer
        run: npm install

      - name: Patch Expo Swift Tools Version Typo
        run: node patch-swift-tools.js

      - name: Build iOS App locally on macOS Runner
        working-directory: volta-customer
        run: |
          set -o pipefail
          EAS_LOCAL_BUILD_SKIP_CLEANUP=1 EAS_BUILD_DISABLE_DOCTOR=1 eas build --platform ios --profile production --local --non-interactive --verbose-logs --output Customer-iOS.ipa 2>&1 | tee eas_build_output.log

      - name: Copy Xcode Logs on failure
        if: failure()
        run: |
          mkdir -p captured_logs
          cp volta-customer/eas_build_output.log captured_logs/ || true
          cp volta-driver/eas_build_output.log captured_logs/ || true
          find /var/folders -name "*.log" 2>/dev/null -exec cp {} captured_logs/ \; || true

      - name: Upload Xcode Logs Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcode-logs
          path: captured_logs/

      - name: Submit iOS App to TestFlight
        working-directory: volta-customer
        run: eas submit --platform ios --profile production --path Customer-iOS.ipa --non-interactive
