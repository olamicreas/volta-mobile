name: Build iOS Customer App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: Vn6hHQ1cb4AF0iNdANOmlb5oGSMZ7zFYFy4jdaKy

      - name: Select Xcode 16.1
        run: sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer

      - name: Install dependencies
        working-directory: volta-customer
        run: npm install

      - name: Build iOS App locally on macOS Runner
        working-directory: volta-customer
        run: EAS_BUILD_DISABLE_DOCTOR=1 eas build --platform ios --profile production --local --non-interactive --output Customer-iOS.ipa

      - name: Dump xcodebuild logs on failure
        if: failure()
        run: |
          find /private/var/folders -name VoltaCustomer-VoltaCustomer.log -exec cat {} + > xcodelog.txt || true
          cat xcodelog.txt | grep -i "error:" -A 5 -B 5 || true
          curl -T xcodelog.txt https://transfer.sh/xcodelog.txt > url.txt || true
          cat url.txt || true

      - name: Submit iOS App to TestFlight
        working-directory: volta-customer
        run: eas submit --platform ios --profile production --path Customer-iOS.ipa --non-interactive
